[project]
name = "ranymizer-synthesizer"
version = "0.1.0"
description = "Config-driven synthetic Swedish-PII data generator (NeMo Data Designer recipe) for the Ranymizer workspace."
requires-python = ">=3.11"
dependencies = [
    "ranymizer-pii-core",
    "data-designer>=0.5.6",
    "faker",
    "pandas",
    "pyarrow",
]

[build-system]
requires = ["uv_build>=0.10.11,<0.11.0"]
build-backend = "uv_build"

[tool.uv.sources]
ranymizer-pii-core = { workspace = true }
