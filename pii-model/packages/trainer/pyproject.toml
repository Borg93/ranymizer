[project]
name = "ranymizer-trainer"
version = "0.1.0"
description = "Turn synthesized Swedish-PII parquet into a trained GLiNER2 model (4 task families, OCR augmentation, LoRA/full fine-tune) for the Ranymizer workspace."
requires-python = ">=3.11"
dependencies = [
    "ranymizer-pii-core",
    "gliner2[local]>=1.3.1",
    "pandas",
    "pyarrow",
]

[build-system]
requires = ["uv_build>=0.10.11,<0.11.0"]
build-backend = "uv_build"

[tool.uv.sources]
ranymizer-pii-core = { workspace = true }
