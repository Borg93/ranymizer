#
# Workspace ROOT + the `pii-model` CLI app.
#   src/ranymizer_pii/   -> thin typer orchestration (this project)
#   packages/core/       -> shared kernel: PII labels + ModelEndpoint (pydantic only)
#   packages/synthesizer/-> config-driven NDD recipe + generation  (data-designer)
#   packages/trainer/    -> parquet -> GLiNER2 JSONL + training     (gliner2[local], torch)
#   packages/evaluation/ -> LLM-as-judge data quality              (deepeval)
#
# The app depends only on typer + pydantic-settings + the four workspace
# packages; the heavy deps live in the package that needs them, so importing
# `ranymizer_pii.cli` (and `pii-model --help`) stays instant.
[project]
name = "ranymizer-pii"
version = "0.1.0"
description = "Ranymizer Swedish-PII pipeline: typer CLI orchestrating the synthesizer/trainer/evaluation packages."
requires-python = ">=3.11"
dependencies = [
    "typer>=0.12",
    "pydantic-settings>=2",
    "ranymizer-pii-core",
    "ranymizer-synthesizer",
    "ranymizer-trainer",
    "ranymizer-evaluation",
    "rich>=14.3.4",
]

[project.scripts]
pii-model = "ranymizer_pii.cli:main"

[build-system]
requires = ["uv_build>=0.10.11,<0.11.0"]
build-backend = "uv_build"

[tool.uv.workspace]
members = ["packages/*"]

[tool.uv.sources]
ranymizer-pii-core = { workspace = true }
ranymizer-synthesizer = { workspace = true }
ranymizer-trainer = { workspace = true }
ranymizer-evaluation = { workspace = true }

[dependency-groups]
dev = [
    "pytest>=9.0.3",
]

[tool.pytest.ini_options]
testpaths = ["packages"]
addopts = "-q"

[tool.ty.environment]
python-version = "3.12"

[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501", "B008"]  # E501: formatter handles width; B008: typer.Option() defaults are intentional
