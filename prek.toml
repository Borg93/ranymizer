[[repos]]
repo = "https://github.com/pre-commit/pre-commit-hooks"
rev = "v5.0.0"
hooks = [
  { id = "trailing-whitespace" },
  { id = "end-of-file-fixer" },
  { id = "check-yaml" },
  { id = "check-toml" },
  { id = "check-added-large-files" },
  { id = "check-merge-conflict" },
]

[[repos]]
repo = "https://github.com/astral-sh/ruff-pre-commit"
rev = "v0.15.13"
hooks = [
  { id = "ruff-format" },
  { id = "ruff", args = ["--fix"] },
]

# Frontend: Biome (lint + format) for TS/JS/JSON. Skip .svelte — Biome doesn't
# parse them; let svelte-check handle component-level type/lint issues.
[[repos]]
repo = "local"

[[repos.hooks]]
id = "biome-check"
name = "biome check (frontend)"
entry = "bash -c 'cd frontend && bunx biome check --write --no-errors-on-unmatched \"$@\"' --"
language = "system"
files = "^frontend/.*\\.(ts|js|mjs|cjs|json|jsonc)$"
exclude = "^frontend/(src-tauri/target|build|\\.svelte-kit|node_modules)/"

[[repos.hooks]]
id = "cargo-fmt"
name = "cargo fmt (Rust / Tauri)"
entry = "bash -c 'cd frontend/src-tauri && cargo fmt --all -- \"$@\"' --"
language = "system"
files = "^frontend/src-tauri/.*\\.rs$"
pass_filenames = false

[[repos]]
repo = "https://github.com/compilerla/conventional-pre-commit"
rev = "v4.3.0"

[[repos.hooks]]
id = "conventional-pre-commit"
stages = ["commit-msg"]
args = ["feat", "fix", "docs", "refactor", "test", "chore", "perf", "ci", "build", "revert"]

[[repos]]
repo = "local"

[[repos.hooks]]
id = "ty-check"
name = "ty type check (non-blocking)"
# Wrapped with `|| true` so it reports diagnostics but never blocks a commit
# (backend/pii-model deps may not be installed in every dev env).
entry = "sh -c 'uvx ty check; true'"
language = "system"
pass_filenames = false
verbose = true

[[repos.hooks]]
id = "no-co-authored-by-claude"
name = "reject Co-Authored-By Claude"
entry = "sh -c '! grep -qi \"co-authored-by.*claude\" \"$1\"' --"
language = "system"
stages = ["commit-msg"]